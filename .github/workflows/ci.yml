name: Steward validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: steward-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Code and local smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:contracts
      - run: bun scripts/gen-abis.ts --check
      - run: bun run build
      - run: bun run test
      - run: bun run test:integration
      - run: bun run test:continuity
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run test:browser:live
      - run: bun run test:browser:live:v2
      - run: bun run test:container
